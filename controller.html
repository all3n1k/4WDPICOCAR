<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Pico 4WD Controller</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0a0e17;
    color: #e0e6f0;
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Connection bar */
  #conn-bar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 44px;
    background: rgba(10, 14, 23, 0.92);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  #conn-bar .left { display: flex; align-items: center; gap: 8px; }
  #conn-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f44; box-shadow: 0 0 6px #f44;
    transition: all 0.3s;
  }
  #conn-dot.on { background: #4f8; box-shadow: 0 0 8px #4f8; }
  #conn-text { font-size: 13px; opacity: 0.7; }
  #conn-bar .right { display: flex; gap: 12px; align-items: center; }
  .toggle-btn {
    padding: 5px 12px; border-radius: 6px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    color: #e0e6f0; font-size: 12px; cursor: pointer;
    transition: all 0.2s;
  }
  .toggle-btn.active { background: rgba(79, 136, 255, 0.3); border-color: #4f88ff; color: #8bb8ff; }

  /* Main layout */
  #app {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
    height: 100dvh;
    padding-top: 44px;
    gap: 0;
  }

  /* Left panel: joystick */
  #left-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    border-right: 1px solid rgba(255,255,255,0.04);
  }

  /* Joystick */
  #joystick-zone {
    width: 220px; height: 220px;
    position: relative;
    touch-action: none;
  }
  #joystick-base {
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 70%, transparent 100%);
    border: 2px solid rgba(255,255,255,0.08);
    position: absolute; top: 0; left: 0;
  }
  #joystick-ring {
    position: absolute;
    width: 160px; height: 160px;
    top: 30px; left: 30px;
    border-radius: 50%;
    border: 1px dashed rgba(255,255,255,0.06);
  }
  #joystick-thumb {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #4f88ff, #2a5ad4);
    box-shadow: 0 2px 16px rgba(79, 136, 255, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    position: absolute;
    top: 78px; left: 78px;
    transition: box-shadow 0.2s;
    pointer-events: none;
  }
  #joystick-thumb.active {
    box-shadow: 0 2px 24px rgba(79, 136, 255, 0.7), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .dir-label {
    position: absolute; font-size: 10px; text-transform: uppercase;
    letter-spacing: 2px; opacity: 0.2; font-weight: 600;
  }
  .dir-label.up { top: -20px; left: 50%; transform: translateX(-50%); }
  .dir-label.down { bottom: -20px; left: 50%; transform: translateX(-50%); }
  .dir-label.left { left: -8px; top: 50%; transform: translateY(-50%) rotate(-90deg); }
  .dir-label.right { right: -8px; top: 50%; transform: translateY(-50%) rotate(90deg); }

  #power-label {
    margin-top: 20px;
    font-size: 36px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #4f88ff;
    opacity: 0.6;
    transition: opacity 0.2s;
    text-align: center;
  }
  #power-label.active { opacity: 1; }
  #dir-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
    opacity: 0.3;
    margin-top: 4px;
  }

  /* Right panel: telemetry */
  #right-panel {
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
    gap: 10px;
    overflow-y: auto;
  }

  /* Radar canvas */
  #radar-container {
    width: 100%;
    aspect-ratio: 2 / 1.2;
    max-height: 45%;
    position: relative;
  }
  #radar-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Telemetry cards */
  .telem-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .telem-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .telem-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    opacity: 0.35;
    margin-bottom: 4px;
  }
  .telem-value {
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }
  .telem-unit { font-size: 12px; opacity: 0.4; font-weight: 400; }

  /* Grayscale bar */
  .gs-row {
    display: flex; gap: 6px; align-items: center;
  }
  .gs-bar {
    flex: 1; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .gs-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #4f88ff, #8bb8ff);
    transition: width 0.15s;
    width: 0%;
  }
  .gs-label { font-size: 9px; opacity: 0.3; width: 14px; text-align: center; }

  /* Action buttons */
  #actions {
    display: flex; gap: 8px; margin-top: auto; padding-top: 8px;
  }
  .action-btn {
    flex: 1;
    padding: 12px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: #e0e6f0;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .action-btn:active { background: rgba(79, 136, 255, 0.2); transform: scale(0.96); }
  .action-btn.danger { border-color: rgba(255, 68, 68, 0.3); color: #f88; }
  .action-btn.danger:active { background: rgba(255, 68, 68, 0.2); }

  /* Portrait layout */
  @media (max-aspect-ratio: 1/1) {
    #app {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }
    #left-panel { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.04); }
    #joystick-zone { width: 180px; height: 180px; }
    #joystick-base { width: 180px; height: 180px; }
    #joystick-ring { width: 130px; height: 130px; top: 25px; left: 25px; }
    #joystick-thumb { top: 58px; left: 58px; }
    #power-label { font-size: 28px; margin-top: 12px; }
  }

  /* Keyboard hints */
  #kb-hint {
    position: absolute; bottom: 8px; left: 0; right: 0;
    text-align: center; font-size: 10px; opacity: 0.15;
  }
</style>
</head>
<body>

<div id="conn-bar">
  <div class="left">
    <div id="conn-dot"></div>
    <span id="conn-text">Disconnected</span>
  </div>
  <div class="right">
    <button class="toggle-btn" id="led-btn" onclick="toggleLED()">LED</button>
    <button class="toggle-btn" id="connect-btn" onclick="toggleConnect()">Connect</button>
  </div>
</div>

<div id="app">
  <div id="left-panel">
    <div id="joystick-zone">
      <div id="joystick-base"></div>
      <div id="joystick-ring"></div>
      <div id="joystick-thumb"></div>
      <span class="dir-label up">FWD</span>
      <span class="dir-label down">REV</span>
      <span class="dir-label left">L</span>
      <span class="dir-label right">R</span>
    </div>
    <div id="power-label">0<span class="telem-unit">%</span></div>
    <div id="dir-label">IDLE</div>
    <div id="kb-hint">WASD or Arrow Keys</div>
  </div>

  <div id="right-panel">
    <div id="radar-container">
      <canvas id="radar-canvas"></canvas>
    </div>
    <div class="telem-row">
      <div class="telem-card">
        <div class="telem-label">Speed</div>
        <div class="telem-value"><span id="v-speed">0.0</span> <span class="telem-unit">cm/s</span></div>
      </div>
      <div class="telem-card">
        <div class="telem-label">Mileage</div>
        <div class="telem-value"><span id="v-mileage">0.00</span> <span class="telem-unit">m</span></div>
      </div>
    </div>
    <div class="telem-card">
      <div class="telem-label">Grayscale</div>
      <div style="display:flex; flex-direction:column; gap:4px; margin-top:6px;">
        <div class="gs-row"><span class="gs-label">L</span><div class="gs-bar"><div class="gs-fill" id="gs-l"></div></div></div>
        <div class="gs-row"><span class="gs-label">M</span><div class="gs-bar"><div class="gs-fill" id="gs-m"></div></div></div>
        <div class="gs-row"><span class="gs-label">R</span><div class="gs-bar"><div class="gs-fill" id="gs-r"></div></div></div>
      </div>
    </div>
    <div id="actions">
      <button class="action-btn" onclick="sendStop()">STOP</button>
      <button class="action-btn danger" onclick="emergencyStop()">E-STOP</button>
    </div>
  </div>
</div>

<script>
const WS_URL = 'ws://192.168.4.1:8765';
let ws = null;
let connected = false;
let ledOn = false;

// Joystick state
let joyActive = false;
let joyTouchId = null;
let currentDir = 'stop';
let currentPower = 0;
let sendInterval = null;

// Radar data
const radarPoints = [];
const RADAR_MAX = 200;

// --- WebSocket ---
function toggleConnect() {
  if (connected) { ws.close(); return; }
  connect();
}

function connect() {
  document.getElementById('conn-text').textContent = 'Connecting...';
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    connected = true;
    document.getElementById('conn-dot').classList.add('on');
    document.getElementById('conn-text').textContent = '192.168.4.1:8765';
    document.getElementById('connect-btn').textContent = 'Disconnect';
    document.getElementById('connect-btn').classList.add('active');
    startSending();
  };
  ws.onclose = () => {
    connected = false;
    document.getElementById('conn-dot').classList.remove('on');
    document.getElementById('conn-text').textContent = 'Disconnected';
    document.getElementById('connect-btn').textContent = 'Connect';
    document.getElementById('connect-btn').classList.remove('active');
    stopSending();
  };
  ws.onerror = () => {
    document.getElementById('conn-text').textContent = 'Connection failed';
  };
  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      updateTelemetry(data);
    } catch {}
  };
}

function send(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

function startSending() {
  if (sendInterval) return;
  sendInterval = setInterval(() => {
    send({ K: currentDir, A: currentPower, G: ledOn });
  }, 100);
}

function stopSending() {
  clearInterval(sendInterval);
  sendInterval = null;
}

// --- Telemetry ---
function updateTelemetry(d) {
  if (d.B !== undefined) {
    document.getElementById('v-speed').textContent =
      typeof d.B === 'number' ? d.B.toFixed(1) : d.B;
  }
  if (d.C !== undefined) {
    document.getElementById('v-mileage').textContent =
      typeof d.C === 'number' ? d.C.toFixed(2) : d.C;
  }
  if (d.D !== undefined && Array.isArray(d.D)) {
    radarPoints.push({ angle: d.D[0], dist: Math.min(d.D[1], RADAR_MAX) });
    if (radarPoints.length > 180) radarPoints.shift();
    drawRadar();
  }
  if (d.H !== undefined && Array.isArray(d.H)) {
    const max = 65535;
    document.getElementById('gs-l').style.width = (d.H[0] / max * 100) + '%';
    document.getElementById('gs-m').style.width = (d.H[1] / max * 100) + '%';
    document.getElementById('gs-r').style.width = (d.H[2] / max * 100) + '%';
  }
}

// --- Radar Canvas ---
function drawRadar() {
  const canvas = document.getElementById('radar-canvas');
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const cx = W / 2, cy = H - 8;
  const R = Math.min(W / 2 - 10, H - 20);

  ctx.clearRect(0, 0, W, H);

  // Grid arcs
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let r = 0.25; r <= 1; r += 0.25) {
    ctx.beginPath();
    ctx.arc(cx, cy, R * r, Math.PI, 0);
    ctx.stroke();
  }
  // Grid lines
  for (let a = -90; a <= 90; a += 30) {
    const rad = a * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(rad) * R, cy - Math.sin(rad) * R);
    ctx.stroke();
  }

  // Distance labels
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.font = '9px system-ui';
  ctx.textAlign = 'center';
  for (let r = 0.5; r <= 1; r += 0.5) {
    ctx.fillText(Math.round(RADAR_MAX * r) + 'cm', cx + 16, cy - R * r + 3);
  }

  // Plot points
  if (radarPoints.length < 2) return;
  const recent = radarPoints.slice(-90);

  // Fill area
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  for (const p of recent) {
    const rad = (p.angle + 90) * Math.PI / 180;
    const d = (p.dist / RADAR_MAX) * R;
    const px = cx + Math.cos(Math.PI - rad) * d;
    const py = cy - Math.sin(Math.PI - rad) * d;
    ctx.lineTo(px, py);
  }
  ctx.closePath();
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  grad.addColorStop(0, 'rgba(79, 255, 136, 0.15)');
  grad.addColorStop(1, 'rgba(79, 255, 136, 0.02)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Stroke line
  ctx.beginPath();
  for (let i = 0; i < recent.length; i++) {
    const p = recent[i];
    const rad = (p.angle + 90) * Math.PI / 180;
    const d = (p.dist / RADAR_MAX) * R;
    const px = cx + Math.cos(Math.PI - rad) * d;
    const py = cy - Math.sin(Math.PI - rad) * d;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = '#4f8';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Latest point
  const last = recent[recent.length - 1];
  const lastRad = (last.angle + 90) * Math.PI / 180;
  const lastD = (last.dist / RADAR_MAX) * R;
  const lx = cx + Math.cos(Math.PI - lastRad) * lastD;
  const ly = cy - Math.sin(Math.PI - lastRad) * lastD;
  ctx.beginPath();
  ctx.arc(lx, ly, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#4f8';
  ctx.fill();

  // Sweep line
  const sweepRad = (last.angle + 90) * Math.PI / 180;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(Math.PI - sweepRad) * R, cy - Math.sin(Math.PI - sweepRad) * R);
  ctx.strokeStyle = 'rgba(79, 255, 136, 0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// --- Joystick ---
const joyZone = document.getElementById('joystick-zone');
const joyThumb = document.getElementById('joystick-thumb');
const powerLabel = document.getElementById('power-label');
const dirLabel = document.getElementById('dir-label');

function getJoyCenter() {
  const r = joyZone.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function processJoy(x, y) {
  const c = getJoyCenter();
  const maxR = joyZone.offsetWidth / 2 - 10;
  let dx = x - c.x;
  let dy = y - c.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const clamp = Math.min(dist, maxR);
  if (dist > 0) { dx = dx / dist * clamp; dy = dy / dist * clamp; }

  // Position thumb
  joyThumb.style.left = (joyZone.offsetWidth / 2 - 32 + dx) + 'px';
  joyThumb.style.top = (joyZone.offsetHeight / 2 - 32 + dy) + 'px';

  // Calculate direction and power
  const pct = clamp / maxR;
  const power = Math.round(pct * 100);
  const angle = Math.atan2(-dy, dx) * 180 / Math.PI;

  let dir = 'stop';
  if (power > 12) {
    if (angle > 45 && angle <= 135) dir = 'forward';
    else if (angle > -135 && angle <= -45) dir = 'backward';
    else if (angle > 135 || angle <= -135) dir = 'left';
    else dir = 'right';
  }

  currentDir = dir;
  currentPower = power;
  powerLabel.innerHTML = power + '<span class="telem-unit">%</span>';
  powerLabel.classList.toggle('active', power > 0);
  dirLabel.textContent = dir === 'stop' ? 'IDLE' : dir.toUpperCase();
}

function resetJoy() {
  joyThumb.style.left = (joyZone.offsetWidth / 2 - 32) + 'px';
  joyThumb.style.top = (joyZone.offsetHeight / 2 - 32) + 'px';
  joyThumb.classList.remove('active');
  currentDir = 'stop';
  currentPower = 0;
  powerLabel.innerHTML = '0<span class="telem-unit">%</span>';
  powerLabel.classList.remove('active');
  dirLabel.textContent = 'IDLE';
}

// Touch events
joyZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joyActive = true;
  joyThumb.classList.add('active');
  processJoy(t.clientX, t.clientY);
});

joyZone.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) processJoy(t.clientX, t.clientY);
  }
});

joyZone.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) { joyActive = false; resetJoy(); }
  }
});
joyZone.addEventListener('touchcancel', () => { joyActive = false; resetJoy(); });

// Mouse events
joyZone.addEventListener('mousedown', (e) => {
  joyActive = true;
  joyThumb.classList.add('active');
  processJoy(e.clientX, e.clientY);
});
window.addEventListener('mousemove', (e) => {
  if (joyActive) processJoy(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => {
  if (joyActive) { joyActive = false; resetJoy(); }
});

// --- Keyboard ---
const keysDown = new Set();
function updateFromKeys() {
  let dir = 'stop', power = 0;
  if (keysDown.has('w') || keysDown.has('arrowup')) { dir = 'forward'; power = 60; }
  else if (keysDown.has('s') || keysDown.has('arrowdown')) { dir = 'backward'; power = 60; }
  else if (keysDown.has('a') || keysDown.has('arrowleft')) { dir = 'left'; power = 50; }
  else if (keysDown.has('d') || keysDown.has('arrowright')) { dir = 'right'; power = 50; }
  currentDir = dir;
  currentPower = power;
  powerLabel.innerHTML = power + '<span class="telem-unit">%</span>';
  powerLabel.classList.toggle('active', power > 0);
  dirLabel.textContent = dir === 'stop' ? 'IDLE' : dir.toUpperCase();
}

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) {
    e.preventDefault();
    keysDown.add(k);
    updateFromKeys();
  }
  if (k === ' ') { e.preventDefault(); sendStop(); }
  if (k === 'l') toggleLED();
});
document.addEventListener('keyup', (e) => {
  keysDown.delete(e.key.toLowerCase());
  updateFromKeys();
});

// --- Controls ---
function toggleLED() {
  ledOn = !ledOn;
  document.getElementById('led-btn').classList.toggle('active', ledOn);
}

function sendStop() {
  currentDir = 'stop'; currentPower = 0;
  send({ K: 'stop', A: 0 });
  resetJoy();
}

function emergencyStop() {
  currentDir = 'stop'; currentPower = 0;
  for (let i = 0; i < 5; i++) send({ K: 'stop', A: 0 });
  resetJoy();
  if (ws) ws.close();
}

// --- Init ---
drawRadar();
window.addEventListener('resize', drawRadar);

// Auto-connect
setTimeout(connect, 500);
</script>
</body>
</html>
